# Deploy by hand (Actions → deploy → Run workflow) from main. Needs the repository secret CLOUDFLARE_API_TOKEN
# (Workers Scripts: Edit on the CountWatch Cloudflare account). The CountWatch key is a Worker secret, not a GitHub one.
name: deploy
on:
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: deploy
  cancel-in-progress: false
jobs:
  deploy:
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - run: npm run check
      - env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
        run: npx wrangler deploy
